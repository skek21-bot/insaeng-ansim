<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>인생안심 길잡이 - 내 뜻대로 정리하고, 남은 가족이 헤매지 않게</title>
  <meta name="theme-color" content="#23121E" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background-color: #180B14;
      color: #F8F1F5;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 16px 16px 80px; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(35, 18, 30, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #4A263D;
      padding: 12px 16px;
    }
    .topbar-inner { max-width: 720px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-box {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #9C527B, #592842);
      display: flex; align-items: center; justify-content: center;
      font-family: serif; font-weight: 900; font-size: 22px; color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .card {
      background: #261420;
      border: 1px solid #4D283E;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .mod-card {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      cursor: pointer; transition: 0.15s;
    }
    .mod-card:hover { background: #311A29; border-color: #7A3E60; }
    .num-circle {
      width: 44px; height: 44px; border-radius: 14px;
      background: #3B2032; border: 1px solid #5E3450;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #E6BFD5; flex-shrink: 0;
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      background: #6B3353; color: #FFE0F0; font-size: 11px; font-weight: 800;
      margin-left: 6px;
    }
    .btn {
      border: 1px solid #633552; background: #381D2F; color: #F8F1F5;
      padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: 0.15s;
    }
    .btn:hover { background: #4D2840; }
    .btn-primary {
      background: linear-gradient(135deg, #9E4E7B, #753358);
      border-color: #B86B96; color: #fff; font-weight: 800;
    }
    .btn-amber {
      background: linear-gradient(135deg, #F59E0B, #EA580C);
      border: none; color: #111; font-weight: 900;
    }
    .btn-emerald {
      background: #065F46; border-color: #10B981; color: #fff; font-weight: 800;
    }
    input, textarea, select {
      width: 100%; background: #180B14; border: 1px solid #542C44;
      color: #fff; padding: 10px 12px; border-radius: 12px;
      font-size: 14px; font-family: inherit; margin-top: 4px;
    }
    label { display: block; font-size: 12px; font-weight: 700; color: #DEC0D1; margin-top: 12px; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin: 12px 0; }
    .tab-btn {
      flex-shrink: 0; padding: 9px 14px; border-radius: 14px;
      border: 1px solid #4A253B; background: #1B0D16; color: #C9A6BA;
      font-size: 13px; font-weight: 800; cursor: pointer;
    }
    .tab-btn.active { background: #8C4A6E; color: #fff; border-color: #DF9EC2; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
    .warn-box {
      background: rgba(120, 53, 15, 0.35); border: 2px solid #F59E0B;
      border-radius: 18px; padding: 16px; margin-bottom: 16px; color: #FEF3C7;
    }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal-box {
      background: #261420; border: 2px solid #8C4A6E; border-radius: 24px;
      max-width: 460px; width: 100%; padding: 22px; max-height: 90vh; overflow-y: auto;
    }
    /* 책자 모달 스타일 */
    .book-modal {
      background: #FFFBFD; color: #2D1B24; border-radius: 20px;
      max-width: 620px; width: 100%; padding: 32px; max-height: 90vh; overflow-y: auto;
      font-family: 'Noto Serif KR', serif; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .book-title { text-align: center; font-size: 24px; font-weight: 900; color: #632B4A; margin-bottom: 4px; }
    .book-sub { text-align: center; font-size: 13px; color: #8C627A; margin-bottom: 24px; border-bottom: 2px solid #E8D0DF; padding-bottom: 12px; }
    .book-chapter { font-size: 16px; font-weight: 700; color: #632B4A; margin-top: 20px; margin-bottom: 8px; border-left: 4px solid #8C4A6E; padding-left: 8px; }
    .book-text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; color: #3D2B34; background: #F8F0F4; padding: 14px; border-radius: 12px; }
    @media print {
      body * { visibility: hidden; }
      #book-print-area, #book-print-area * { visibility: visible; }
      #book-print-area { position: absolute; left: 0; top: 0; width: 100%; background: #fff; color: #000; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let reg of regs) { reg.unregister(); }
      });
    }

    const STORAGE_KEY = 'insaeng_ansim_v5';
    const API_KEY_STORAGE = 'insaeng_ansim_gemini_key';

    const DEFAULT_STATE = {
      activeModule: null,
      autobiography: {
        q1: '가족들을 위해 열심히 달렸던 젊은 날의 봄날과, 아이들이 처음 태어났던 날의 미소가 가장 기억에 남습니다.',
        q2: '살아오면서 때로는 조급함에 실수를 하기도 하고, 내 뜻대로 되지 않아 가장 크게 후회했던 순간이 있었습니다. 하지만 그 아픔이 나를 더 단단하게 만들었어요.',
        q3: '내 인생에 평생 마르지 않는 은혜를 베풀어준 부모님과, 말없이 내 곁을 지켜준 귀한 인연들에게 진심으로 고마움을 전합니다.',
        q4: '이 세상을 떠날 때 물질적인 것보다 "따뜻한 마음과 성실함은 결코 배신하지 않는다"는 신조를 남기고 싶습니다.',
        q5: '힘든 순간도 있었지만 우리 가족이 곁에 있어 참 따뜻하고 행복한 삶이었습니다.',
        q6: '서로 다투지 말고 명절이나 기일에는 맛있는 음식을 먹으며 웃는 얼굴로 나를 떠올려 주렴.'
      },
      familyMembers: [
        {
          id: 'fam-1',
          name: '배우자 (여보)',
          relation: '배우자',
          icon: '💑',
          occasion: '내가 떠난 직후 열어볼 편지',
          targetDate: '2030-05-15',
          email: '',
          keywords: '평생 내 곁을 지켜줘서 고마워, 식사 거르지 말고 건강 잘 챙겨요',
          letter: '사랑하는 여보, 평생 부족한 내 곁을 든든하게 지켜주고 우리 가족의 버팀목이 되어주어서 정말 고마웠어요. 내가 먼저 소풍을 떠나더라도 식사 절대 거르지 말고, 아이들과 함께 건강하고 편안하게 지내길 바라요.'
        },
        {
          id: 'fam-2',
          name: '첫째 자녀',
          relation: '첫째 자녀',
          icon: '👧',
          occasion: '결혼하거나 중요한 출발을 할 때',
          targetDate: '2032-10-15',
          email: '',
          keywords: '든든한 맏이여서 늘 고마웠어, 동생과 사이좋게 지내고 네 꿈을 응원해',
          letter: '우리 든든한 첫째야, 언제나 맏이로서 부모 마음 먼저 헤아려주고 동생을 챙겨주어 참 고맙고 대견했단다. 살면서 힘든 날이 찾아와도 너는 충분히 지혜롭게 이겨낼 수 있는 멋진 사람이야. 늘 응원한다!'
        }
      ],
      selectedFamilyId: 'fam-1',
      medical: {
        cpr: false, ventilator: false, dialysis: false, anticancer: false, hospice: true,
        careNote: '의미 없는 고통의 연장보다는 통증을 줄이고 가족들과 손을 잡으며 평온하게 마무리하고 싶습니다.'
      },
      funeral: {
        method: '화장 후 수목장(자연장)',
        scale: '가족과 가까운 지인만 모이는 소규모 가족장',
        photoNote: '최근 가족여행에서 가장 환하게 웃고 있는 사진으로 해주세요.',
        message: '검은 상복 대신 단정한 평상복을 입고, 내 옛날이야기를 나누며 따뜻한 식사 한 끼 하고 가세요.'
      },
      treasure: {
        assets: [
          { id: 'ast-1', category: '🏦 예·적금/통장', inst: 'NH농협은행 (주거래)', memo: '안방 서랍장 두 번째 칸 파란색 파일철에 통장 보관', checked: true },
          { id: 'ast-2', category: '🛡️ 보험 증권', inst: '삼성생명 실손보험', memo: '거실 책장 문서함에 종이 보험증권 보관', checked: true }
        ],
        hasSpouse: true,
        childrenCount: 2
      },
      roadmap: {
        baseDate: '2026-10-25',
        memorialTitle: '부모님 기일 추모 및 가족 모임 알림',
        memorialFamilyEmails: '',
        memorialMessage: '슬퍼하지 말고 온 가족이 모여 맛있는 식사를 하며 따뜻한 추억을 나누는 날이 되길 바랍니다.'
      }
    };

    let savedRaw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('insaeng_ansim_v4') || localStorage.getItem('insaeng_ansim_v3');
    let state = savedRaw ? JSON.parse(savedRaw) : JSON.parse(JSON.stringify(DEFAULT_STATE));
    if (!state.autobiography || typeof state.autobiography.q4 === 'undefined') {
      state.autobiography = JSON.parse(JSON.stringify(DEFAULT_STATE.autobiography));
    }
    let apiKey = localStorage.getItem(API_KEY_STORAGE) || '';
    let activeModal = null; // 'addFamily' | 'addAsset' | 'preview' | 'api' | 'book' | null

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getCurrentFamily() {
      return state.familyMembers.find(f => f.id === state.selectedFamilyId) || state.familyMembers[0];
    }

    function openGoogleCalendar(title, dateStr, details, emails, isYearly) {
      const clean = (dateStr || '2026-10-25').replace(/-/g, '');
      const y = parseInt(clean.slice(0,4), 10);
      const m = parseInt(clean.slice(4,6), 10) - 1;
      const d = parseInt(clean.slice(6,8), 10);
      const start = new Date(y, m, d);
      const end = new Date(y, m, d + 1);
      const fmt = dt => dt.getFullYear() + String(dt.getMonth()+1).padStart(2,'0') + String(dt.getDate()).padStart(2,'0');
      let url = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent(title)
        + '&dates=' + fmt(start) + '/' + fmt(end)
        + '&details=' + encodeURIComponent(details);
      if (isYearly) url += '&recur=' + encodeURIComponent('RRULE:FREQ=YEARLY');
      if (emails && emails.trim()) {
        const guests = emails.split(',').map(e => e.trim()).filter(Boolean).join(',');
        if (guests) url += '&add=' + encodeURIComponent(guests);
      }
      window.open(url, '_blank');
    }

    function downloadIcs(title, dateStr, details, isYearly, filename) {
      const clean = (dateStr || '2026-10-25').replace(/-/g, '');
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//InsaengAnsim//KR',
        'BEGIN:VEVENT', 'DTSTART;VALUE=DATE:' + clean
      ];
      if (isYearly) lines.push('RRULE:FREQ=YEARLY');
      lines.push('SUMMARY:' + title);
      lines.push('DESCRIPTION:' + (details || '').replace(/\r?\n/g, '\\n'));
      lines.push('END:VEVENT', 'END:VCALENDAR');
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename || '인생안심_알림.ics';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function polishWithAI() {
      const fam = getCurrentFamily();
      if (!fam) return;
      const btn = document.getElementById('ai-polish-btn');
      if (btn) btn.innerText = '✨ 다듬는 중...';

      if (!apiKey.trim()) {
        setTimeout(() => {
          fam.letter = `사랑하는 나의 ${fam.name} (${fam.relation})에게,\n\n`
            + `네가 이 편지를 열어볼 때쯤이면 "${fam.occasion}"이라는 뜻깊은 날을 맞이하고 있겠구나.\n`
            + `돌아보면 우리 가족과 함께 웃고 보낸 사계절이 내 인생의 가장 큰 선물이었단다. `
            + `특히 "${fam.keywords}"라는 내 진심을 꼭 전하고 싶었어.\n\n`
            + `${state.autobiography.q6}\n언제 어디서나 건강하고 행복하길 진심으로 응원한다. 사랑한다.`;
          saveState();
          render();
        }, 400);
        return;
      }

      try {
        const prompt = `당신은 한국의 부모님(또는 배우자)이 가족에게 남기는 웰다잉 타임캡슐 편지 대필 작가입니다.
수신인: ${fam.name} (${fam.relation})
개봉 시점: ${fam.occasion} (${fam.targetDate})
핵심 메모: ${fam.keywords}
다정하고 따뜻한 한국어 편지 본문(4~6문장)만 작성해 주세요.`;
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + apiKey.trim(), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (text) fam.letter = text.trim();
      } catch (e) {
        fam.letter = `사랑하는 ${fam.name}에게,\n\n"${fam.occasion}"을 진심으로 축하하며 이 편지를 남긴다.\n${fam.keywords}.\n언제나 건강하고 행복한 삶이 되기를 마음 깊이 응원한다.`;
      }
      saveState();
      render();
    }

    function render() {
      const root = document.getElementById('app');
      const fam = getCurrentFamily();

      const hasSpouse = state.treasure.hasSpouse;
      const childCnt = Math.max(0, Number(state.treasure.childrenCount) || 0);
      const totalW = (hasSpouse ? 1.5 : 0) + childCnt * 1.0;
      const spousePct = totalW > 0 && hasSpouse ? ((1.5 / totalW) * 100).toFixed(1) : 0;
      const childPct = totalW > 0 && childCnt > 0 ? ((1.0 / totalW) * 100).toFixed(1) : 0;

      const bp = (state.roadmap.baseDate || '2026-10-25').split('-').map(Number);
      const baseD = new Date(bp[0], bp[1] - 1, bp[2]);
      const fmtD = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      const d1m = fmtD(new Date(baseD.getFullYear(), baseD.getMonth() + 1, baseD.getDate()));
      const d3m = fmtD(new Date(baseD.getFullYear(), baseD.getMonth() + 3, baseD.getDate()));
      const d6m = fmtD(new Date(baseD.getFullYear(), baseD.getMonth() + 7, 0));
      const d1y = fmtD(new Date(baseD.getFullYear(), baseD.getMonth() + 13, 0));

      let html = `
        <div class="topbar">
          <div class="topbar-inner">
            <div class="brand" onclick="goHome()">
              <div class="logo-box">安</div>
              <div>
                <div style="font-weight:900; font-size:17px; color:#fff;">인생안심 길잡이</div>
                <div style="font-size:11px; color:#D1B3C4;">내 뜻대로 정리하고, 남은 가족이 헤매지 않게</div>
              </div>
            </div>
            <div style="display:flex; gap:6px;">
              ${state.activeModule !== null ? `<button class="btn" onclick="goHome()">← 전체 메뉴</button>` : ''}
              <button class="btn btn-amber" onclick="openModal('book')">📖 내 인생 책자</button>
              <button class="btn" onclick="openModal('api')">🔑 ${apiKey.trim() ? 'AI 켜짐' : 'AI 키'}</button>
            </div>
          </div>
        </div>
        <div class="container">
      `;

      if (state.activeModule === null) {
        html += `
          <div class="card" style="background:linear-gradient(135deg,#34192B,#1E0D18); border-color:#633552;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              <div>
                <span class="badge" style="margin-left:0; margin-bottom:8px;">100% 무료 · 자서전 &amp; 웰다잉 엔딩노트</span>
                <h1 style="margin:4px 0 8px; font-size:26px; font-weight:900;">인생안심 길잡이</h1>
                <p style="margin:0; font-size:14px; color:#DBC3D0;">
                  내 뜻대로 정리하고, 남은 가족이 헤매지 않게.<br/>
                  입력한 모든 기록은 한 권의 <strong>'내 인생 책자(PDF)'</strong>로 엮을 수 있습니다.
                </p>
              </div>
              <button class="btn btn-amber" style="padding:12px 16px; font-size:14px; flex-shrink:0;" onclick="openModal('book')">📖 내 인생 책자 보기</button>
            </div>
          </div>

          <div class="card mod-card" onclick="openModule(1)">
            <div style="display:flex; align-items:center; gap:14px;">
              <div class="num-circle">①</div>
              <div>
                <div style="font-weight:900; font-size:17px;">마음 갈무리 <span style="font-size:13px; font-weight:500; color:#CFAAC0;">6문 6답 자서전 &amp; 가족 편지</span> <span class="badge">★ 대가족 편지함 (${state.familyMembers.length}명)</span></div>
                <div style="font-size:12px; color:#B894A8; margin-top:3px;">인생 회고·후회·은혜 등 6문 6답 + 다자녀 타임캡슐 편지 + AI 윤문</div>
              </div>
            </div>
            <span style="color:#9E6B88; font-size:20px;">›</span>
          </div>

          <div class="card mod-card" onclick="openModule(2)">
            <div style="display:flex; align-items:center; gap:14px;">
              <div class="num-circle">②</div>

              <button class="btn btn-emerald" onclick="icsMemorial()">📲 카톡 공유용 매년 반복 달력파일(.ics)</button>
            </div>
          </div>
        `;
      }

      html += `</div>`;

      // 모달 1: 새 가족 추가
      if (activeModal === 'addFamily') {
        html += `
          <div class="modal-bg" onclick="closeModal()">
            <div class="modal-box" onclick="event.stopPropagation()">
              <h3 style="margin-top:0;">➕ 새 가족 구성원 편지함 추가</h3>
              <label>가족 호칭 또는 이름</label>
              <input id="nf-name" type="text" placeholder="예: 셋째 김별, 손주 민준이" />
              <label>나와의 관계</label>
              <select id="nf-rel">
                <option value="배우자">💑 배우자</option>
                <option value="첫째 자녀">👧 첫째 자녀</option>
                <option value="둘째 자녀">👦 둘째 자녀</option>
                <option value="셋째 자녀">🧒 셋째 자녀 / 다자녀</option>
                <option value="손주">👶 손자 · 손녀</option>
                <option value="부모님/형제">🌷 부모님 · 형제자매</option>
              </select>
              <label>언제 열어볼 타임캡슐인가요?</label>
              <input id="nf-occ" type="text" value="특별한 기념일에 열어볼 편지" />
              <label>타임캡슐 개봉 날짜</label>
              <input id="nf-date" type="date" value="2035-05-01" />
              <div class="grid-2" style="margin-top:16px;">
                <button class="btn" onclick="closeModal()">취소</button>
                <button class="btn btn-primary" onclick="confirmAddFamily()">추가하기</button>
              </div>
            </div>
          </div>
        `;
      }

      // 모달 2: 새 자산 추가
      if (activeModal === 'addAsset') {
        html += `
          <div class="modal-bg" onclick="closeModal()">
            <div class="modal-box" onclick="event.stopPropagation()">
              <h3 style="margin-top:0;">➕ 보물지도 새 자산 항목 추가</h3>
              <label>자산 종류 선택</label>
              <select id="na-cat">
                <option value="🏦 예·적금/통장">🏦 은행 예·적금 / 통장</option>
                <option value="🛡️ 보험 증권">🛡️ 생명·실손·암보험 증권</option>
                <option value="🏠 부동산/문서">🏠 부동산 등기권리증 · 계약서</option>
                <option value="📈 연금/주식">📈 개인연금 · 증권사 계좌</option>
                <option value="📱 디지털 계정">📱 스마트폰 사진첩 · 상조</option>
                <option value="📦 기타 금고">📦 금고 · 귀금속 등 기타</option>
              </select>
              <label>금융기관명 또는 자산 명칭</label>
              <input id="na-inst" type="text" placeholder="예: 신한은행 적금, 현대해상 보험" />
              <label>보관 위치 메모 (계좌번호 입력 금지)</label>
              <input id="na-memo" type="text" placeholder="예: 안방 서랍장 파란 파일철" />
              <div class="grid-2" style="margin-top:16px;">
                <button class="btn" onclick="closeModal()">취소</button>
                <button class="btn btn-primary" onclick="confirmAddAsset()">자산 추가하기</button>
              </div>
            </div>
          </div>
        `;
      }

      // 모달 3: 수신 화면 미리보기
      if (activeModal === 'preview') {
        html += `
          <div class="modal-bg" onclick="closeModal()">
            <div class="modal-box" onclick="event.stopPropagation()">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="badge" style="margin-left:0;">💌 타임캡슐 수신 화면 미리보기</span>
                <button class="btn" style="padding:4px 10px;" onclick="closeModal()">✕ 닫기</button>
              </div>
              <div class="tabs">
                ${state.familyMembers.map(m => `
                  <button class="tab-btn ${m.id === fam.id ? 'active' : ''}" onclick="selectFamily('${m.id}')">${m.icon} ${m.name}</button>
                `).join('')}
              </div>
              <div style="background:#FFF9FB; color:#1E293B; padding:18px; border-radius:16px; margin-top:8px;">
                <div style="font-size:12px; font-weight:800; color:#8C4A6E;">📅 개봉일: ${fam.targetDate} · ${fam.occasion}</div>
                <h4 style="margin:6px 0 10px; font-size:18px;">To. ${fam.name} (${fam.relation})</h4>
                <div style="white-space:pre-line; font-size:14px; border-top:1px solid #FBCFE8; padding-top:10px;">${fam.letter}</div>
              </div>
            </div>
          </div>
        `;
      }

      // 모달 4: API 키 설정
      if (activeModal === 'api') {
        html += `
          <div class="modal-bg" onclick="closeModal()">
            <div class="modal-box" onclick="event.stopPropagation()">
              <h3 style="margin-top:0;">🔑 무료 Gemini AI 키 설정</h3>
              <p style="font-size:12px; color:#CDB0C0;">키를 입력하면 AI가 편지를 더욱 따뜻하게 다듬어 줍니다.</p>
              <input id="api-input" type="password" placeholder="AIzaSy... 키 입력" value="${apiKey}" />
              <div class="grid-2" style="margin-top:16px;">
                <button class="btn" onclick="closeModal()">닫기</button>
                <button class="btn btn-primary" onclick="saveKeyFromModal()">저장하기</button>
              </div>
            </div>
          </div>
        `;
      }

      // ★ 모듈 5: 내 인생 책자 (PDF/프린트 출력용 모달)
      if (activeModal === 'book') {
        let familyLettersHtml = state.familyMembers.map(f => `
          <div style="margin-bottom:16px; background:#F8F0F4; padding:14px; border-radius:12px; border-left:4px solid #8C4A6E;">
            <strong style="color:#632B4A; font-size:15px;">To. ${f.name} (${f.relation})</strong>
            <div style="font-size:12px; color:#8C627A; margin-bottom:6px;">개봉 시점: ${f.occasion} (${f.targetDate})</div>
            <div style="font-size:13.5px; line-height:1.8; white-space:pre-wrap;">${f.letter}</div>
          </div>
        `).join('');

        let assetsHtml = state.treasure.assets.map(a => `
          <tr>
            <td style="padding:8px; border-bottom:1px solid #E8D0DF; font-weight:700;">${a.category}</td>
            <td style="padding:8px; border-bottom:1px solid #E8D0DF;">${a.inst}</td>
            <td style="padding:8px; border-bottom:1px solid #E8D0DF;">${a.memo}</td>
          </tr>
        `).join('');

        html += `
          <div class="modal-bg" onclick="closeModal()">
            <div class="book-modal" onclick="event.stopPropagation()" id="book-print-area">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <span style="font-size:12px; font-weight:700; color:#8C627A;">📖 인생안심 자서전 & 엔딩노트 기록</span>
                <button class="btn" style="padding:4px 10px;" onclick="closeModal()">✕ 닫기</button>
              </div>

              <div class="book-title">나의 인생 기록과 유산</div>
              <div class="book-sub">인생안심 길잡이 통합 출력본 · 작성일: ${new Date().toISOString().slice(0,10)}</div>

              <div class="book-chapter">제1장. 내 인생의 6문 6답 자서전</div>
              <div class="book-text">
                <b>Q1. 가장 빛났던 봄날:</b><br/>${state.autobiography.q1}<br/><br/>
                <b>Q2. 가장 큰 후회와 깨달음:</b><br/>${state.autobiography.q2}<br/><br/>
                <b>Q3. 평생 고마웠던 은인:</b><br/>${state.autobiography.q3}<br/><br/>
                <b>Q4. 자녀들에게 남기는 삶의 철학:</b><br/>${state.autobiography.q4}<br/><br/>
                <b>Q5. 가족에게 전하는 진심:</b><br/>${state.autobiography.q5}<br/><br/>
                <b>Q6. 기억되길 바라는 모습:</b><br/>${state.autobiography.q6}
              </div>

              <div class="book-chapter">제2장. 가족들에게 남기는 타임캡슐 편지</div>
              <div>${familyLettersHtml}</div>

              <div class="book-chapter">제3장. 존엄한 결정 및 장례 디자인</div>
              <div class="book-text">
                • 연명의료 의향: ${state.medical.cpr ? '시행 희망' : '연명치료 거부'} (호스피스 이용 희망)<br/>
                • 돌봄 당부: ${state.medical.careNote}<br/>
                • 장례 및 안치 방식: ${state.funeral.method} (${state.funeral.scale})<br/>
                • 조문객 당부: ${state.funeral.message}
              </div>

              <div class="book-chapter">제4장. 자산 보물지도 요약</div>
              <table style="width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;">
                <thead>
                  <tr style="background:#E8D0DF; color:#632B4A; text-align:left;">
                    <th style="padding:8px;">자산 종류</th>
                    <th style="padding:8px;">기관명</th>
                    <th style="padding:8px;">보관 위치 메모</th>
                  </tr>
                </thead>
                <tbody>${assetsHtml}</tbody>
              </table>

              <div style="margin-top:24px; display:flex; gap:10px;">
                <button class="btn btn-primary" style="flex:1; padding:14px; font-size:15px;" onclick="window.print()">🖨️ PDF로 저장하기 / 인쇄하기</button>
                <button class="btn" style="flex:1; padding:14px; font-size:15px;" onclick="closeModal()">닫기</button>
              </div>
            </div>
          </div>
        `;
      }

      root.innerHTML = html;
    }

    window.goHome = () => { state.activeModule = null; saveState(); render(); };
    window.openModule = (n) => { state.activeModule = n; saveState(); render(); window.scrollTo(0,0); };
    window.openModal = (m) => { activeModal = m; render(); };
    window.closeModal = () => { activeModal = null; render(); };
    window.selectFamily = (id) => { state.selectedFamilyId = id; saveState(); render(); };
    window.updateAuto = (k, v) => { state.autobiography[k] = v; saveState(); };
    window.updateFam = (k, v) => { const f = getCurrentFamily(); if (f) { f[k] = v; saveState(); } };
    window.toggleMed = (k) => { state.medical[k] = !state.medical[k]; saveState(); render(); };

    window.updateAsset = (idx, key, val) => {
      if (state.treasure.assets[idx]) {
        state.treasure.assets[idx][key] = val;
        saveState();
      }
    };
    window.toggleAssetCheck = (idx) => {
      if (state.treasure.assets[idx]) {
        state.treasure.assets[idx].checked = state.treasure.assets[idx].checked === false ? true : false;
        saveState();
        render();
      }
    };
    window.deleteAsset = (idx) => {
      if (state.treasure.assets.length <= 1) { alert('최소 1개의 자산은 남아있어야 합니다.'); return; }
      state.treasure.assets.splice(idx, 1);
      saveState();
      render();
    };
    window.confirmAddAsset = () => {
      const cat = document.getElementById('na-cat')?.value || '🏦 예·적금/통장';
      const inst = document.getElementById('na-inst')?.value?.trim();
      const memo = document.getElementById('na-memo')?.value?.trim() || '보관 위치';
      if (!inst) { alert('금융기관명을 입력해 주세요.'); return; }
      state.treasure.assets.push({ id: 'ast-' + Date.now(), category: cat, inst, memo, checked: true });
      saveState();
      closeModal();
    };

    window.saveKeyFromModal = () => {
      apiKey = document.getElementById('api-input')?.value || '';
      localStorage.setItem(API_KEY_STORAGE, apiKey);
      closeModal();
    };
    window.confirmAddFamily = () => {
      const name = document.getElementById('nf-name')?.value?.trim();
      const rel = document.getElementById('nf-rel')?.value || '자녀';
      const occ = document.getElementById('nf-occ')?.value || '특별한 날';
      const dt = document.getElementById('nf-date')?.value || '2035-05-01';
      if (!name) { alert('가족 이름을 입력해 주세요.'); return; }
      const icons = { '배우자':'💑', '첫째 자녀':'👧', '둘째 자녀':'👦', '셋째 자녀':'🧒', '손주':'👶', '부모님/형제':'🌷' };
      const id = 'fam-' + Date.now();
      state.familyMembers.push({
        id, name, relation: rel, icon: icons[rel] || '💌',
        occasion: occ, targetDate: dt, email: '',
        keywords: '고마운 우리 가족, 늘 행복하길',
        letter: `사랑하는 ${name}에게,\n내 삶의 큰 기쁨이 되어주어 고마웠단다. 이 편지를 열어보는 날에도 네 미소가 가득하길 기도할게.`
      });
      state.selectedFamilyId = id;
      saveState();
      closeModal();
    };
    window.deleteFamily = (id) => {
      if (state.familyMembers.length <= 1) return;
      state.familyMembers = state.familyMembers.filter(f => f.id !== id);
      state.selectedFamilyId = state.familyMembers[0].id;
      saveState();
      render();
    };
    window.calFam = () => {
      const f = getCurrentFamily();
      openGoogleCalendar(`[인생안심 타임캡슐] ${f.name} (${f.occasion})`, f.targetDate, f.letter, f.email, false);
    };
    window.icsFam = () => {
      const f = getCurrentFamily();
      downloadIcs(`[타임캡슐 편지] ${f.name} (${f.occasion})`, f.targetDate, f.letter, false, `타임캡슐_${f.name}.ics`);
    };
    window.calMemorial = () => {
      openGoogleCalendar(state.roadmap.memorialTitle, state.roadmap.baseDate, state.roadmap.memorialMessage, state.roadmap.memorialFamilyEmails, true);
    };
    window.icsMemorial = () => {
      downloadIcs(state.roadmap.memorialTitle, state.roadmap.baseDate, state.roadmap.memorialMessage, true, '인생안심_매년기일알림.ics');
    };

    render();
  </script>
</body>
</html>
