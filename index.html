  <script type="text/babel">

    // 기본 초기 데이터 (다자녀/대가족 멀티 탭 기본 세팅)

        {

        },
        {

          icon: '👧',
          occasion: '결혼하거나 중요한 출발을 할 때',

          keywords: '든든한 맏이여서 늘 고마웠어, 동생과 사이좋게 지내고 네 꿈을 응원해',
          letter: '우리 든든한 첫째야, 언제나 맏이로서 부모 마음 먼저 헤아려주고 동생을 챙겨주어 참 고맙고 대견했단다. 살면서 힘든 날이 찾아와도 너는 충분히 지혜롭게 이겨낼 수 있는 멋진 사람이야. 동생과 늘 서로 의지하며 네가 원하는 행복한 삶을 마음껏 펼쳐나가렴.'

        {

        }
      ],
      selectedFamilyId: 'fam-1',
      medical: {
        cpr: false,
        ventilator: false,
        dialysis: false,
        anticancer: false,
        hospice: true,
        carePlace: '가정 호스피스 또는 가족과 가까운 요양병원',
        careNote: '의미 없는 고통의 연장보다는 통증을 줄이고 가족들과 손을 잡으며 평온하게 마무리하고 싶습니다.'
      },
      funeral: {
        method: '화장 후 수목장(자연장)',
        scale: '가족과 가까운 지인만 모이는 소규모 가족장 (2일장 또는 무빈소)',
        photoNote: '영정사진은 최근 가족여행에서 가장 환하게 웃고 있는 사진으로 해주세요.',
        musicAndFlower: '국화꽃 대신 내가 좋아하던 밝은 계절 꽃을 놓고, 잔잔한 클래식이나 가곡을 틀어주세요.',
        message: '검은 상복 대신 단정한 평상복을 입고, 슬퍼하기보다 내 옛날이야기를 나누며 따뜻한 식사 한 끼 하고 가세요.'
      },
      treasure: {
        assets: [
          { id: 'a1', category: '주거래 은행 예·적금', inst: 'NH농협은행 / 국민은행', memo: '안방 서랍장 두 번째 칸 파란색 파일철에 통장 보관 (계좌번호 미기재)', checked: true },
          { id: 'a2', category: '실손·생명보험 증권', inst: '삼성생명 / 우체국보험', memo: '내 휴대폰 보험사 앱 및 거실 책장 문서함에 종이 증권 보관', checked: true },
          { id: 'a3', category: '부동산·계약 문서', inst: '자택 등기권리증', memo: '안방 금고 상단 서류봉투 보관', checked: true },
          { id: 'a4', category: '디지털 계정·사진첩', inst: '구글 포토 / 카카오톡', memo: '가족 공유 앨범에 옛 사진 백업 완료', checked: false }
        ],
        hasSpouse: true,
        childrenCount: 2,
        willCheck: {
          fullHandwritten: true,
          fullDate: true,
          address: true,
          name: true,
          seal: false
        }
      },
      roadmap: {
        baseDate: '2026-10-25',
        memorialTitle: '부모님 기일 추모 및 가족 모임 알림',
        memorialFamilyEmails: '',
        memorialMessage: '슬퍼하지 말고 온 가족이 모여 맛있는 식사를 하며 따뜻한 추억을 나누는 날이 되길 바랍니다.'
      }
    };

    function App() {
      const [state, setState] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return { ...DEFAULT_STATE, ...parsed };
          }
        } catch (e) {}
        return DEFAULT_STATE;
      });

      const [apiKey, setApiKey] = useState(() => localStorage.getItem(API_KEY_STORAGE) || '');
      const [showApiModal, setShowApiModal] = useState(false);
      const [showAddFamilyModal, setShowAddFamilyModal] = useState(false);
      const [showPreviewModal, setShowPreviewModal] = useState(false);
      const [aiLoading, setAiLoading] = useState(false);

      // 새 가족 추가 모달 입력값
      const [newFamName, setNewFamName] = useState('');
      const [newFamRelation, setNewFamRelation] = useState('셋째 자녀');
      const [newFamOccasion, setNewFamOccasion] = useState('특별한 기념일에 열어볼 편지');
      const [newFamDate, setNewFamDate] = useState('2036-05-01');

      // 상태 변경 시 자동 localStorage 저장
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }, [state]);

      const saveApiKey = (val) => {
        setApiKey(val);
        localStorage.setItem(API_KEY_STORAGE, val);
      };

      const resetAllData = () => {
        if (window.confirm('이 기기에 저장된 모든 작성 내용을 초기 상태로 되돌리시겠습니까?')) {
          localStorage.removeItem(STORAGE_KEY);
          setState(DEFAULT_STATE);
        }
      };

      // 현재 선택된 가족 객체
      const currentFamily =
        state.familyMembers.find((f) => f.id === state.selectedFamilyId) ||
        state.familyMembers[0];

      const updateCurrentFamily = (patch) => {
        setState((prev) => ({
          ...prev,
          familyMembers: prev.familyMembers.map((f) =>
            f.id === currentFamily.id ? { ...f, ...patch } : f
          )
        }));
      };

      const handleAddFamily = () => {
        if (!newFamName.trim()) {
          alert('추가할 가족의 이름이나 호칭을 입력해 주세요.');
          return;
        }
        const iconMap = {
          '배우자': '💑',
          '첫째 자녀': '👧',
          '둘째 자녀': '👦',
          '셋째 자녀': '🧒',
          '손주': '👶',
          '부모님/형제': '🌷'
        };
        const newId = 'fam-' + Date.now();
        const newMember = {
          id: newId,
          name: newFamName.trim(),
          relation: newFamRelation,
          icon: iconMap[newFamRelation] || '💌',
          occasion: newFamOccasion || '미래에 열어볼 타임캡슐 편지',
          targetDate: newFamDate || '2035-01-01',
          email: '',
          keywords: '늘 건강하고 행복하길 바라는 마음, 고마웠던 우리 가족의 추억',
          letter: `사랑하는 ${newFamName.trim()}에게,
언제나 내 삶의 큰 기쁨이 되어주어 고마웠단다. 이 편지를 열어보는 날에도 네 얼굴에 따뜻한 미소가 가득하길 진심으로 기도할게.`
        };
        setState((prev) => ({
          ...prev,
          familyMembers: [...prev.familyMembers, newMember],
          selectedFamilyId: newId
        }));
        setNewFamName('');
        setShowAddFamilyModal(false);
      };

      const handleDeleteFamily = (id) => {
        if (state.familyMembers.length <= 1) {
          alert('최소 1명의 가족 수신인은 남아있어야 합니다.');
          return;
        }
        if (!window.confirm('이 가족의 편지 탭을 삭제하시겠습니까?')) return;
        const filtered = state.familyMembers.filter((f) => f.id !== id);
        setState((prev) => ({
          ...prev,
          familyMembers: filtered,
          selectedFamilyId: filtered[0].id
        }));
      };

      // ★ Gemini AI 실시간 맞춤 편지 다듬기
      const polishLetterWithAI = async () => {
        if (!currentFamily) return;
        setAiLoading(true);
        const cleanKey = apiKey.trim();

        if (!cleanKey) {
          // API 키가 없을 때도 수신인 관계와 키워드를 반영해 감동적인 문장으로 자동 윤문
          setTimeout(() => {
            const polished = `사랑하는 나의 ${currentFamily.name} (${currentFamily.relation})에게,

` +
              `이 편지를 네가 열어볼 때쯤이면 "${currentFamily.occasion}"이라는 뜻깊은 시간을 맞이하고 있겠구나.

` +
              `돌아보면 내가 삶에서 가장 잘한 일은 우리 가족과 함께 웃고 울며 소중한 계절들을 보낸 것이었단다. ` +
              `특히 "${currentFamily.keywords}"라는 내 마음속 진심을 꼭 너에게 전하고 싶었어.

` +
              `${state.autobiography.q3 || '언제 어디서나 건강 잘 챙기고, 서로 아끼며 행복하게 살아가렴.'}

` +
              `하늘에서도 언제나 너의 가장 든든한 편이 되어 응원할게. 사랑한다.`;
            updateCurrentFamily({ letter: polished });
            setAiLoading(false);
          }, 600);
          return;
        }

        try {
          const prompt = `당신은 한국의 부모님(또는 배우자)이 가족에게 남기는 웰다잉 타임캡슐 편지를 다듬어주는 따뜻한 대필 작가입니다.
수신인 이름/호칭: ${currentFamily.name}
수신인과의 관계: ${currentFamily.relation}
편지를 열어볼 시점: ${currentFamily.occasion} (${currentFamily.targetDate})
전하고 싶은 핵심 메모/키워드: ${currentFamily.keywords}
작성자의 인생 회고 한마디: ${state.autobiography.q2}

[작성 원칙]
1. 수신인과의 관계(${currentFamily.relation})에 딱 맞는 자연스럽고 다정한 한국어 어투로 4~6문장 분량의 감동적인 편지를 작성하세요.
2. 사용자가 적은 핵심 메모의 사실을 왜곡하지 말고 따뜻하게 풀어내세요.
3. 불필요한 설명 없이 편지 본문만 출력하세요.`;

          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${cleanKey}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.65 }
              })
            }
          );
          if (!res.ok) throw new Error('API Error');
          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            updateCurrentFamily({ letter: text.trim() });
          }
        } catch (err) {
          alert('AI 키 호출 중 일시적 오류가 발생하여 기본 감성 윤문 템플릿으로 다듬었습니다.');
          const fallback = `사랑하는 ${currentFamily.name}에게,

"${currentFamily.occasion}"을 맞이한 너에게 진심을 담아 이 편지를 남긴다.
${currentFamily.keywords}.
늘 건강하고 행복한 나날만 가득하길 마음 깊이 응원한다.`;
          updateCurrentFamily({ letter: fallback });
        } finally {
          setAiLoading(false);
        }
      };

      // ★ 구글 캘린더 원클릭 등록 URL 생성 (가족 이메일 게스트 초대 + 매년 반복 지원)
      const openGoogleCalendar = ({ title, dateStr, details, emails, isYearly }) => {
        const cleanDate = (dateStr || '2026-10-25').replace(/-/g, '');
        // 종일 일정은 시작일 ~ 다음날 형식 (YYYYMMDD/YYYYMMDD)
        const y = parseInt(cleanDate.slice(0, 4), 10);
        const m = parseInt(cleanDate.slice(4, 6), 10) - 1;
        const d = parseInt(cleanDate.slice(6, 8), 10);
        const startObj = new Date(y, m, d);
        const endObj = new Date(y, m, d + 1);
        const fmt = (dt) => {
          const yy = dt.getFullYear();
          const mm = String(dt.getMonth() + 1).padStart(2, '0');
          const dd = String(dt.getDate()).padStart(2, '0');
          return `${yy}${mm}${dd}`;
        };
        const datesParam = `${fmt(startObj)}/${fmt(endObj)}`;
        let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${datesParam}&details=${encodeURIComponent(details)}`;
        if (isYearly) {
          url += `&recur=${encodeURIComponent('RRULE:FREQ=YEARLY')}`;
        }
        if (emails && emails.trim()) {
          // 콤마로 구분된 가족 이메일들을 참석자(add) 파라미터로 전달
          const guestList = emails
            .split(',')
            .map((e) => e.trim())
            .filter(Boolean)
            .join(',');
          if (guestList) {
            url += `&add=${encodeURIComponent(guestList)}`;
          }
        }
        window.open(url, '_blank', 'noopener,noreferrer');
      };

      // ★ 카카오톡/문자 공유용 만능 .ics 달력 파일 생성 및 다운로드
      const downloadIcsFile = ({ title, dateStr, details, isYearly, filename }) => {
        const cleanDate = (dateStr || '2026-10-25').replace(/-/g, '');
        const rruleLine = isYearly ? 'RRULE:FREQ=YEARLY
' : '';
        const escapedDesc = (details || '').replace(/
/g, '\n');
        const icsContent =
          'BEGIN:VCALENDAR
' +
          'VERSION:2.0
' +
          'PRODID:-//InsaengAnsim//KR
' +
          'BEGIN:VEVENT
' +
          `DTSTART;VALUE=DATE:${cleanDate}
` +
          rruleLine +
          `SUMMARY:${title}
` +
          `DESCRIPTION:${escapedDesc}
` +
          'END:VEVENT
' +
          'END:VCALENDAR';

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename || '인생안심_가족알림.ics';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // ★ 고정된 법정상속분 계산 로직 (배우자 1.5 : 자녀 각 1.0 — AI 추측 배제, 코드 연산 고정)
      const calcInheritanceShares = () => {
        const hasSpouse = state.treasure.hasSpouse;
        const n = Math.max(0, Number(state.treasure.childrenCount) || 0);
        if (!hasSpouse && n === 0) return { spousePct: 0, childPct: 0, totalWeight: 0 };
        if (hasSpouse && n === 0) return { spousePct: 100, childPct: 0, totalWeight: 1.5 };
        if (!hasSpouse && n > 0) return { spousePct: 0, childPct: +(100 / n).toFixed(1), totalWeight: n };
        const totalWeight = 1.5 + n * 1.0;
        const spousePct = +((1.5 / totalWeight) * 100).toFixed(1);
        const childPct = +((1.0 / totalWeight) * 100).toFixed(1);
        return { spousePct, childPct, totalWeight };
      };

                      <li>✅ <strong>3. 주소 자필 기재:</strong> 현재 주민등록상 주소를 직접 손글씨 기재</li>
                      <li>✅ <strong>4. 성명 자필 기재:</strong> 본인의 이름을 직접 손글씨 기재</li>
                      <li>✅ <strong>5. 날인 (도장 또는 무인):</strong> 인감도장 날인 또는 엄지손가락 지장(무인) 필수 (단순 사인·서명만 하면 무효 위험!)</li>
                    </ul>
                  </div>

                  <div className="rounded-3xl bg-[#23121D] border border-[#4A253B] p-5 space-y-3">
                    <h4 className="font-extrabold text-white text-sm">💰 사전 증여재산공제 법정 한도 (고정 기준)</h4>
                    <p className="text-[11px] text-[#C49EB5]">
                      사망 전 10년 이내에 상속인에게 증여한 재산은 상속세 계산 시 합산되므로 미리 계획하는 것이 유리합니다.
                    </p>
                    <div className="space-y-2 text-xs">
                      <div className="p-2.5 rounded-xl bg-[#180B14] border border-[#432236] flex justify-between">
                        <span>• 배우자로부터 증여 (10년간)</span>
                        <strong className="text-[#FFD6EC]">6억 원 공제</strong>
                      </div>
                      <div className="p-2.5 rounded-xl bg-[#180B14] border border-[#432236] flex justify-between">
                        <span>• 성년 자녀에게 증여 (10년간)</span>
                        <strong className="text-[#FFD6EC]">5,000만 원 공제</strong>
                      </div>
                      <div className="p-2.5 rounded-xl bg-[#180B14] border border-[#432236] flex justify-between">
                        <span>• 미성년 자녀에게 증여 (10년간)</span>
                        <strong className="text-[#FFD6EC]">2,000만 원 공제</strong>
                      </div>
                      <div className="p-2.5 rounded-xl bg-[#341A2B] border border-[#7A3E60] flex justify-between">
                        <span>★ 혼인·출산 증여재산공제 (2024년~)</span>
                        <strong className="text-amber-300">최대 1억 원 추가 공제</strong>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* =========================================================
                모듈 ⑤ 사후 행정 로드맵 & 기일 알림 (D-Day 자동 계산 + 구글 캘린더 가족 초대)
            ========================================================= */}
            {state.activeModule === 5 && (
              <div className="space-y-6">
                <div className="rounded-3xl bg-[#261420] border border-[#542C44] p-6 space-y-2">
                  <span className="text-xs font-bold text-[#E5A4C7]">모듈 ⑤ 사후 로드맵 & 기일 알림</span>
                  <h2 className="text-2xl font-black text-white">D-Day 사후 행정 타임라인 & 매년 기일 캘린더 공유</h2>
                  <p className="text-xs text-[#CDB0C0]">
                    기준일(사망일) 1건만 입력하면 가족들이 놓치기 쉬운 법정 신고 기한을 코드로 정확히 계산해주며, 매년 돌아오는 기일 알림을 가족들의 구글 캘린더에 등록합니다.
                  </p>
                </div>

                {/* 1. D-Day 법정 행정 타임라인 계산기 */}
                <div className="rounded-3xl bg-[#23121D] border border-[#4A253B] p-6 space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <h3 className="text-lg font-extrabold text-white">🗓️ 1. 기준일(사망일) 기반 법정 기한 자동 계산</h3>
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-bold text-[#DEC0D1]">기준 날짜:</span>
                      <input
                        type="date"
                        value={state.roadmap.baseDate}
                        onChange={(e) =>
                          setState((prev) => ({
                            ...prev,
                            roadmap: { ...prev.roadmap, baseDate: e.target.value }
                          }))
                        }
                        className="rounded-xl bg-[#180B14] border border-[#6E3B58] px-3 py-1.5 text-sm text-white font-bold"
                      />
                    </div>
                  </div>

                  <div className="space-y-3">
                    {deadlines.map((item, i) => (
                      <div
                        key={i}
                        className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                          item.important
                            ? 'bg-[#331929] border-[#9E4E7B]'
                            : 'bg-[#180B14] border-[#422135]'
                        }`}
                      >
                        <div className="space-y-1">
                          <span className="inline-block px-2 py-0.5 rounded bg-[#572B45] text-[#FFD9EC] text-[11px] font-black">
                            {item.step}
                          </span>
                          <div className="font-extrabold text-white text-sm">{item.title}</div>
                          <div className="text-xs text-[#C49EB5]">{item.rule}</div>
                        </div>
                        <div className="sm:text-right shrink-0">
                          <div className="text-[11px] text-[#D4AFC3]">법정 마감 기한</div>
                          <div className="text-lg font-black text-amber-300">{item.deadline} 까지</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* 2. ★ 매년 반복 기일 알림 구글 캘린더 가족 초대 & .ics 파일 공유 */}
                <div className="rounded-3xl bg-[#261420] border-2 border-[#7A3E60] p-6 space-y-4">
                  <h3 className="text-lg font-extrabold text-white">
                    🔔 2. 매년 반복 기일 알림 — 구글 캘린더 가족 동시 초대
                  </h3>
                  <p className="text-xs text-[#CDB0C0]">
                    자동 문자 발송처럼 유료 서버가 필요한 방식 대신, 가족들의 구글 이메일(Gmail)을 입력해 <strong>구글 캘린더 ‘매년 반복(YEARLY)’ 일정</strong>으로 가족 전원에게 알림이 울리도록 설정합니다.
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-[#DEC0D1] mb-1">
                        캘린더 일정 제목
                      </label>
                      <input
                        type="text"
                        value={state.roadmap.memorialTitle}
                        onChange={(e) =>
                          setState((prev) => ({
                            ...prev,
                            roadmap: { ...prev.roadmap, memorialTitle: e.target.value }
                          }))
                        }
                        className="w-full rounded-xl bg-[#180B14] border border-[#522B43] px-3 py-2 text-sm text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-[#DEC0D1] mb-1">
                        초대할 가족 이메일 주소 (쉼표 , 로 여러 명 입력 가능)
                      </label>
                      <input
                        type="text"
                        value={state.roadmap.memorialFamilyEmails}
                        onChange={(e) =>
                          setState((prev) => ({
                            ...prev,
                            roadmap: { ...prev.roadmap, memorialFamilyEmails: e.target.value }
                          }))
                        }
                        placeholder="예: first@gmail.com, second@gmail.com"
                        className="w-full rounded-xl bg-[#180B14] border border-[#522B43] px-3 py-2 text-sm text-white"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-[#DEC0D1] mb-1">
                      매년 기일마다 가족들이 캘린더에서 보게 될 당부 메시지
                    </label>
                    <textarea
                      rows={2}
                      value={state.roadmap.memorialMessage}
                      onChange={(e) =>
                        setState((prev) => ({
                          ...prev,
                          roadmap: { ...prev.roadmap, memorialMessage: e.target.value }
                        }))
                      }
                      className="w-full rounded-xl bg-[#180B14] border border-[#522B43] p-3 text-sm text-white"
                    />
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                    <button
                      onClick={() =>
                        openGoogleCalendar({
                          title: state.roadmap.memorialTitle,
                          dateStr: state.roadmap.baseDate,
                          details: `[인생안심 기일 당부]
${state.roadmap.memorialMessage}

• 희망 장례/안치: ${state.funeral.method}`,
                          emails: state.roadmap.memorialFamilyEmails,
                          isYearly: true
                        })
                      }
                      className="py-3.5 px-4 rounded-2xl bg-gradient-to-r from-[#9E4E7B] to-[#78355B] hover:from-[#B05A8A] hover:to-[#8A3E69] text-white font-black text-xs shadow-md transition"
                    >
                      📅 구글 캘린더 ‘매년 반복’ 등록 + 가족 이메일 초대
                    </button>

                    <button
                      onClick={() =>
                        downloadIcsFile({
                          title: state.roadmap.memorialTitle,
                          dateStr: state.roadmap.baseDate,
                          details: state.roadmap.memorialMessage,
                          isYearly: true,
                          filename: '인생안심_매년기일알림.ics'
                        })
                      }
                      className="py-3.5 px-4 rounded-2xl bg-emerald-800 hover:bg-emerald-700 text-white font-black text-xs shadow-md transition"
                    >
                      📲 카톡 단톡방 공유용 매년 반복 달력파일(.ics) 받기
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* =========================================================
              모달 1: 새 가족 구성원 추가 모달
          ========================================================= */}
          {showAddFamilyModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-[#261420] border-2 border-[#8C4A6E] rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-white">➕ 새 가족 구성원 편지함 추가</h3>
                  <button
                    onClick={() => setShowAddFamilyModal(false)}
                    className="text-sm text-[#C9A6BA] font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-[#DEC0D1] mb-1">가족 호칭 또는 이름</label>
                    <input
                      type="text"
                      value={newFamName}
                      onChange={(e) => setNewFamName(e.target.value)}
                      placeholder="예: 셋째 김별, 사랑하는 손주 민준이"
                      className="w-full rounded-xl bg-[#180B14] border border-[#542C44] px-3 py-2.5 text-sm text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-[#DEC0D1] mb-1">나와의 관계</label>
                    <select
                      value={newFamRelation}
                      onChange={(e) => setNewFamRelation(e.target.value)}
                      className="w-full rounded-xl bg-[#180B14] border border-[#542C44] px-3 py-2.5 text-sm text-white"
                    >
                      <option value="배우자">💑 배우자</option>
                      <option value="첫째 자녀">👧 첫째 자녀</option>
                      <option value="둘째 자녀">👦 둘째 자녀</option>
                      <option value="셋째 자녀">🧒 셋째 자녀 / 다자녀</option>
                      <option value="손주">👶 손자 · 손녀</option>
                      <option value="부모님/형제">🌷 부모님 · 형제자매</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-[#DEC0D1] mb-1">언제 열어볼 타임캡슐인가요?</label>
                    <input
                      type="text"
                      value={newFamOccasion}
                      onChange={(e) => setNewFamOccasion(e.target.value)}
                      placeholder="예: 대학 입학 날, 서른 살 생일"
                      className="w-full rounded-xl bg-[#180B14] border border-[#542C44] px-3 py-2.5 text-sm text-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-[#DEC0D1] mb-1">타임캡슐 개봉 예정 날짜</label>
                    <input
                      type="date"
                      value={newFamDate}
                      onChange={(e) => setNewFamDate(e.target.value)}
                      className="w-full rounded-xl bg-[#180B14] border border-[#542C44] px-3 py-2.5 text-sm text-white"
                    />
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setShowAddFamilyModal(false)}
                    className="flex-1 py-2.5 rounded-xl bg-[#381D2F] text-[#D4AFC3] text-xs font-bold"
                  >
                    취소
                  </button>
                  <button
                    onClick={handleAddFamily}
                    className="flex-1 py-2.5 rounded-xl bg-[#8C4A6E] hover:bg-[#A1567F] text-white text-xs font-black"
                  >
                    추가하기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================
              모달 2: 가족 수신 화면 미리보기 (시연용 모달)
          ========================================================= */}
          {showPreviewModal && currentFamily && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-gradient-to-b from-[#2E1625] to-[#1B0D16] border-2 border-[#A86489] rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b border-[#4D283E] pb-3">
                  <span className="px-2.5 py-1 rounded-full bg-[#6B3353] text-[#FFE0F0] text-xs font-black">
                    💌 타임캡슐 수신 화면 미리보기
                  </span>
                  <button
                    onClick={() => setShowPreviewModal(false)}
                    className="text-sm text-[#C9A6BA] font-bold"
                  >
                    ✕ 닫기
                  </button>
                </div>

                {/* 모달 안에서도 다른 가족 탭으로 바로 전환하며 시연 가능 */}
                <div className="flex gap-1.5 overflow-x-auto pb-1">
                  {state.familyMembers.map((f) => (
                    <button
                      key={f.id}
                      onClick={() => setState((prev) => ({ ...prev, selectedFamilyId: f.id }))}
                      className={`px-2.5 py-1 rounded-lg text-[11px] font-bold shrink-0 ${
                        f.id === currentFamily.id ? 'bg-[#8C4A6E] text-white' : 'bg-[#180B14] text-[#B894A8]'
                      }`}
                    >
                      {f.icon} {f.name}
                    </button>
                  ))}
                </div>

                <div className="bg-[#FFF9FB] text-slate-900 rounded-2xl p-5 space-y-3 shadow-inner">
                  <div className="text-xs font-bold text-[#8C4A6E]">
                    📅 개봉일: {currentFamily.targetDate} · {currentFamily.occasion}
                  </div>
                  <h4 className="text-lg font-black text-slate-900">
                    To. {currentFamily.name} ({currentFamily.relation})
                  </h4>
                  <p className="text-sm text-slate-800 whitespace-pre-line leading-relaxed border-t border-rose-100 pt-3">
                    {currentFamily.letter}
                  </p>
                </div>

                <button
                  onClick={() => setShowPreviewModal(false)}
                  className="w-full py-3 rounded-xl bg-[#8C4A6E] text-white font-black text-xs"
                >
                  확인 닫기
                </button>
              </div>
            </div>
          )}

          {/* =========================================================
              모달 3: 무료 Gemini API 키 연결 모달
          ========================================================= */}
          {showApiModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
              <div className="bg-[#261420] border-2 border-[#8C4A6E] rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-black text-white">🔑 무료 Gemini AI 키 설정</h3>
                  <button
                    onClick={() => setShowApiModal(false)}
                    className="text-sm text-[#C9A6BA] font-bold"
                  >
                    ✕
                  </button>
                </div>
                <p className="text-xs text-[#CDB0C0] leading-relaxed">
                  • 키를 넣지 않아도 5개 모듈 전체 기능과 기본 편지 다듬기, 법정상속분·D-Day 계산이 100% 작동합니다.<br />
                  • Google AI Studio에서 발급받은 무료 Gemini API 키를 입력하면 가족별 키워드에 맞춰 실시간 AI가 편지를 더욱 풍성하게 윤문해 줍니다. (이 기기에만 저장됨)
                </p>
                <input
                  type="password"
                  value={apiKey}
                  onChange={(e) => saveApiKey(e.target.value)}
                  placeholder="AIzaSy... 로 시작하는 Gemini API 키 입력"
                  className="w-full rounded-xl bg-[#180B14] border border-[#6E3B58] px-3 py-2.5 text-sm text-white font-mono"
                />
                <button
                  onClick={() => setShowApiModal(false)}
                  className="w-full py-3 rounded-xl bg-[#8C4A6E] hover:bg-[#A1567F] text-white font-black text-xs"
                >
                  저장하고 닫기
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // 기존 PWA 서비스워커 자동 등록 유지
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
